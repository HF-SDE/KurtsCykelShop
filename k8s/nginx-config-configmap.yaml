apiVersion: v1
data:
  nginx.conf: "# Top-level configurations (e.g., user, worker processes)\nuser nginx;\nworker_processes auto;\n\n# Error log and PID settings\nerror_log /var/log/nginx/error.log;\npid /var/run/nginx.pid;\n\n# Load modules (if needed)\ninclude /etc/nginx/modules/*.conf;\n\n# Events block\nevents {\n    worker_connections 1024;\n}\n\nhttp {\n\n    # Upgrade HTTP connection to WebSocket dynamically\n    map $http_upgrade $connection_upgrade {\n        default upgrade;\n        ''      close;\n    }\n\n    # Define the MIME types\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n\n    # Log format and location\n    access_log /var/log/nginx/access.log;\n\n    # Enable gzip\n    gzip on;\n    gzip_proxied no-cache no-store private expired auth no_last_modified;\n    gzip_types \n    text/plain \n    text/css\n    text/xml\n    text/javascript\n    application/x-javascript\n    application/xml\n    application/xml+rss\n    application/xhtml+xml\n    application/atom_xml\n    application/x-font-ttf\n    application/x-font-opentype\n    image/svg+xml;\n\n    # Define server block for HTTP to HTTPS redirection\n    server {\n        listen 80 default_server;\n        listen [::]:80 default_server;\n\n        server_name _;\n\n        location /health {\n            return 200 'Nginx is healthy';\n            add_header Content-Type text/plain;\n        }\n        location /api/ {\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Host $hostname;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection $connection_upgrade;\n\n            proxy_pass http://backend:5000/;\n        }\n    }\n}"
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: reverse-proxy
  name: nginx-config
