apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - args:
            - npm
            - run
            - dev
          envFrom:
            - configMapRef:
                name: backend-env
            - secretRef:
                name: backend-secret
          image: backend:latest
          imagePullPolicy: IfNotPresent
          name: backend
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          ports:
            - containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/src/app/nodemon.json
              name: backend-nodemon
              subPath: nodemon.json
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: nodemon.json
                path: nodemon.json
            name: backend-nodemon
          name: backend-nodemon
